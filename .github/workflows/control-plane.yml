# Optional central control plane: staggered dispatch + fleet dashboard.
#
# Uses a GitHub App installation token with `actions: write` only (dispatch runs, read run
# artifacts). It does not scan, does not hold the Anthropic key and cannot write code:
# every scan runs in its target repository with that repository's own GITHUB_TOKEN.
#
# Scheduled runs are off until the repository variable SECUBOT_CONTROL_PLANE is "true"
# (set it once the dispatch App secrets and control-plane/fleet.yml are in place).
# Manual runs (workflow_dispatch) always run.
name: secubot control plane

on:
  schedule:
    - cron: "7 * * * *" # hourly: each repository runs in its own slot (fleet.yml `slots`)
    - cron: "41 6 * * *" # daily: collect run reports into the dashboard
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [dispatch, report]
        default: dispatch
      all:
        description: Dispatch every repository now (ignore slots)
        type: boolean
        default: false
      repo:
        description: Only this repository (owner/name)
        type: string
        default: ""

permissions: {}

jobs:
  dispatch:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 * * * *' &&
        vars.SECUBOT_CONTROL_PLANE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: secubot
          persist-credentials: false
      - uses: ./secubot/.github/actions/setup-secubot
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SECUBOT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SECUBOT_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ALL: ${{ inputs.all }}
          ONLY: ${{ inputs.repo }}
        run: |
          args=(--fleet secubot/control-plane/fleet.yml)
          [ "$ALL" = "true" ] && args+=(--all)
          [ -n "$ONLY" ] && args+=(--repo-filter "$ONLY")
          secubot fleet-dispatch "${args[@]}"

  report:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 6 * * *' &&
        vars.SECUBOT_CONTROL_PLANE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'report')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443 pypi.org:443 files.pythonhosted.org:443 releases.astral.sh:443
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: secubot
          persist-credentials: false
      - uses: ./secubot/.github/actions/setup-secubot
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SECUBOT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SECUBOT_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
      - name: Collect run reports
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: secubot fleet-report --fleet secubot/control-plane/fleet.yml --out dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # the report step fails when a repository needs attention
        with:
          name: secubot-fleet-dashboard
          path: |
            dashboard/dashboard.md
            dashboard/fleet.json
          retention-days: 90
