# Repositories driven by the control plane. Each must already contain the caller workflow
# (examples/target-repo/.github/workflows/secfix.yml) with a `workflow_dispatch` trigger,
# and the dispatch App must be installed on it.
workflow: secfix.yml # caller workflow file name in each repository
ref: main
slots: 24 # hourly control-plane cron + 24 slots = each repository once a day, spread out
delay_seconds: 2
report_artifact: "secubot*-report"
repos:
  - repo: damhau/awxnext
  - repo: damhau/rami
